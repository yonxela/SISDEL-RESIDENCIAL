<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISDEL - Panel Auditor</title>
    <meta name="description" content="Panel de auditoría de condominio SISDEL: consulta en modo lectura y reportes.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Las pestanas se desplazan en pantallas angostas en vez de apretarse */
        .audit-tabs { overflow-x: auto; scrollbar-width: none; }
        .audit-tabs::-webkit-scrollbar { display: none; }
        .audit-tabs .tab { flex: 1 0 auto; white-space: nowrap; padding: 0.75rem 1rem; }

        .ro-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.35rem 0.75rem; border-radius: var(--radius-full);
            background: var(--warning-bg); color: var(--warning);
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em;
        }

        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end;
            margin-bottom: 1.25rem;
        }
        .filter-bar .field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 140px; }
        .filter-bar .field.grow { flex: 1; min-width: 200px; }
        .filter-bar label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        .form-input.plain { padding: 0.65rem 0.85rem; font-size: 0.9rem; }
        .btn-sm { padding: 0.55rem 1rem; font-size: 0.875rem; }

        .presets { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .preset {
            padding: 0.4rem 0.85rem; border-radius: var(--radius-full);
            border: 1px solid var(--border-strong); background: var(--bg-surface);
            color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; cursor: pointer;
        }
        .preset.active { background: var(--primary); border-color: var(--primary); color: white; }

        .result-note { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .result-note.warn { color: var(--warning); }

        .item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; text-align: right; }
        .plate { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: 0.04em; }

        .report-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .report-head h3 { font-size: 1.15rem; }
        .report-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
        .report-card { padding: 1.25rem; }
        .report-card h4 { font-size: 0.95rem; margin-bottom: 0.75rem; }
        .table-wrap { overflow-x: auto; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .report-table th, .report-table td { padding: 0.55rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border-strong); }
        .report-table th { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .report-table td.num, .report-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
        .report-table tr:last-child td { border-bottom: none; }

        #statsGrid .stat-label, .report-kpis .stat-label { font-size: 0.85rem; color: var(--text-muted); }
        #statsGrid, .report-kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

        @media (max-width: 640px) {
            .top-bar { flex-wrap: wrap; gap: 0.75rem; }
            .top-bar-actions { gap: 0.5rem; flex-wrap: wrap; }
            .report-grid { grid-template-columns: 1fr; }
            #statsGrid, .report-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
            #statsGrid .stat-card, .report-kpis .stat-card { padding: 0.65rem 0.85rem; }
            #statsGrid .stat-label, .report-kpis .stat-label { font-size: 0.75rem; }
            .list-item { flex-wrap: wrap; gap: 0.75rem; }
            .item-meta { align-items: flex-start; text-align: left; }
        }

        /* Impresion del reporte (Guardar como PDF): solo el reporte, en claro */
        @media print {
            body, body.light-mode {
                --bg-app: #fff; --bg-surface: #fff; --bg-surface-solid: #fff; --bg-item: #eee;
                --text-primary: #000; --text-secondary: #222; --text-muted: #555;
                --border-strong: #ccc; --border-subtle: #ddd;
                background: #fff;
            }
            .bg-decor, .top-bar, .audit-tabs, #statsGrid, .no-print, .app-footer { display: none !important; }
            .page-content { padding: 0; }
            .card, .report-card, .stat-card { box-shadow: none !important; backdrop-filter: none !important; break-inside: avoid; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>

<body>
    <div class="bg-decor">
        <div class="decor-1"></div>
        <div class="decor-2"></div>
    </div>

    <div class="page-container">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" width="24" height="24">
                        <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1 id="condoNameHeader">SISDEL</h1>
                    <p>Panel Auditor</p>
                </div>
            </div>
            <div class="top-bar-actions">
                <a class="btn btn-ghost btn-sm" href="rondin/" title="Rondas de vigilancia (solo lectura)" style="border:1px solid var(--border-strong);">Rondas</a>
                <span class="ro-badge" title="Este perfil no puede crear, editar ni eliminar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    Solo lectura
                </span>
                <button class="btn btn-ghost btn-icon theme-toggle" id="themeToggle" title="Cambiar Tema">
                    <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <span id="auditorName" class="badge badge-info"></span>
                <button class="btn btn-ghost btn-sm" id="btnLogout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Salir
                </button>
            </div>
        </header>

        <div class="page-content">
            <div class="stats-grid compact" id="statsGrid"></div>

            <div class="tabs audit-tabs" id="mainTabs">
                <button class="tab active" data-view="usuarios">Usuarios</button>
                <button class="tab" data-view="visitas">Visitas</button>
                <button class="tab" data-view="vehiculos">Vehículos</button>
                <button class="tab" data-view="accesos">Accesos</button>
                <button class="tab" data-view="mensajes">Mensajes</button>
                <button class="tab" data-view="reportes">Reportes</button>
            </div>

            <!-- Usuarios -->
            <section class="view" id="view-usuarios">
                <div class="filter-bar">
                    <div class="field grow">
                        <label for="userSearch">Buscar</label>
                        <input type="search" class="form-input plain" id="userSearch" placeholder="Nombre, casa o teléfono">
                    </div>
                    <div class="field">
                        <label for="userRole">Rol</label>
                        <select class="form-input plain" id="userRole">
                            <option value="">Todos</option>
                            <option value="vecino">Vecinos</option>
                            <option value="policia">Guardias</option>
                            <option value="admin">Administradores</option>
                            <option value="auditor">Auditores</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="userPayment">Estado de pago</label>
                        <select class="form-input plain" id="userPayment">
                            <option value="">Todos</option>
                            <option value="al_dia">Al día</option>
                            <option value="moroso">Morosos</option>
                        </select>
                    </div>
                </div>
                <p class="result-note" id="usersNote"></p>
                <div id="usersList"></div>
            </section>

            <!-- Visitas -->
            <section class="view" id="view-visitas" style="display:none;">
                <div class="filter-bar">
                    <div class="field">
                        <label for="visitFrom">Desde</label>
                        <input type="date" class="form-input plain" id="visitFrom">
                    </div>
                    <div class="field">
                        <label for="visitTo">Hasta</label>
                        <input type="date" class="form-input plain" id="visitTo">
                    </div>
                    <div class="field grow">
                        <label for="visitSearch">Buscar</label>
                        <input type="search" class="form-input plain" id="visitSearch" placeholder="Visitante, casa o placa">
                    </div>
                    <button class="btn btn-primary btn-sm" id="btnVisitSearch">Consultar</button>
                </div>
                <p class="result-note" id="visitsNote"></p>
                <div id="visitsList"></div>
            </section>

            <!-- Vehiculos -->
            <section class="view" id="view-vehiculos" style="display:none;">
                <div class="filter-bar">
                    <div class="field grow">
                        <label for="vehicleSearch">Buscar</label>
                        <input type="search" class="form-input plain" id="vehicleSearch" placeholder="Placa, propietario o casa">
                    </div>
                </div>
                <p class="result-note" id="vehiclesNote"></p>
                <div id="vehiclesList"></div>
            </section>

            <!-- Accesos (camara LPR y registros de garita) -->
            <section class="view" id="view-accesos" style="display:none;">
                <div class="filter-bar">
                    <div class="field">
                        <label for="logFrom">Desde</label>
                        <input type="date" class="form-input plain" id="logFrom">
                    </div>
                    <div class="field">
                        <label for="logTo">Hasta</label>
                        <input type="date" class="form-input plain" id="logTo">
                    </div>
                    <div class="field">
                        <label for="logStatus">Resultado</label>
                        <select class="form-input plain" id="logStatus">
                            <option value="">Todos</option>
                            <option value="Authorized">Autorizados</option>
                            <option value="Reminder">Con aviso de mora</option>
                            <option value="Denied">Denegados</option>
                        </select>
                    </div>
                    <div class="field grow">
                        <label for="logSearch">Buscar</label>
                        <input type="search" class="form-input plain" id="logSearch" placeholder="Placa o detalle">
                    </div>
                    <button class="btn btn-primary btn-sm" id="btnLogSearch">Consultar</button>
                </div>
                <p class="result-note" id="logsNote"></p>
                <div id="logsList"></div>
            </section>

            <!-- Mensajes -->
            <section class="view" id="view-mensajes" style="display:none;">
                <p class="result-note" id="messagesNote"></p>
                <div id="messagesList"></div>
            </section>

            <!-- Reportes -->
            <section class="view" id="view-reportes" style="display:none;">
                <div class="card no-print" style="padding:1.25rem; margin-bottom:1.5rem;">
                    <div class="presets" id="reportPresets">
                        <button class="preset" data-preset="today">Hoy</button>
                        <button class="preset" data-preset="7d">Últimos 7 días</button>
                        <button class="preset active" data-preset="30d">Últimos 30 días</button>
                        <button class="preset" data-preset="month">Este mes</button>
                        <button class="preset" data-preset="lastMonth">Mes anterior</button>
                    </div>
                    <div class="filter-bar" style="margin-bottom:0;">
                        <div class="field">
                            <label for="reportFrom">Desde</label>
                            <input type="date" class="form-input plain" id="reportFrom">
                        </div>
                        <div class="field">
                            <label for="reportTo">Hasta</label>
                            <input type="date" class="form-input plain" id="reportTo">
                        </div>
                        <button class="btn btn-primary btn-sm" id="btnReport">Generar reporte</button>
                    </div>
                </div>
                <div id="reportOutput"></div>
            </section>
        </div>

        <footer class="app-footer">
            Software desarrollado por <strong>SISDEL INTERNATIONAL</strong> &copy; 2026 &reg;
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>
    <script src="firebase-client.js?v=20260929"></script>
    <script src="sisdel-core.js?v=20261108b"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await SISDEL.requireAuth([SISDEL.ROLES.AUDITOR]);
            if (!session) return;

            const condoId = session.condominioId;
            const condoName = session.condominioName || '';
            document.getElementById('condoNameHeader').textContent = condoName;
            document.getElementById('auditorName').textContent = session.userName || '';
            document.getElementById('btnLogout').addEventListener('click', () => SISDEL.logout());

            // Tope de registros por consulta: rangos muy largos se piden en partes
            const MAX_LOGS = 5000;
            const MAX_RANGE_DAYS = 366;

            const ICONS = {
                download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
                print: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
            };

            // --- Tema ---
            const themeIcon = document.getElementById('themeIcon');
            const applyTheme = (theme) => {
                document.body.classList.toggle('light-mode', theme === 'light');
                themeIcon.innerHTML = theme === 'light'
                    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
                    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />';
            };
            applyTheme(localStorage.getItem('sisdel_theme') || 'dark');
            document.getElementById('themeToggle').addEventListener('click', () => {
                const next = document.body.classList.contains('light-mode') ? 'dark' : 'light';
                localStorage.setItem('sisdel_theme', next);
                applyTheme(next);
            });

            // --- Utilidades ---
            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }
            function pad(n) { return String(n).padStart(2, '0'); }
            function ymd(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
            function parseYmd(text) {
                const [y, m, d] = String(text).split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
            function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
            // Rango de fechas locales -> instantes ISO [inicio del primer dia, inicio del dia siguiente al ultimo)
            function isoRange(from, to) {
                return { fromIso: parseYmd(from).toISOString(), toIso: addDays(parseYmd(to), 1).toISOString() };
            }
            function daysBetween(from, to) { return Math.round((parseYmd(to) - parseYmd(from)) / 86400000) + 1; }
            function validRange(from, to) {
                if (!from || !to) { SISDEL.showToast('Indique las dos fechas', 'warning'); return false; }
                if (from > to) { SISDEL.showToast('La fecha inicial es posterior a la final', 'warning'); return false; }
                if (daysBetween(from, to) > MAX_RANGE_DAYS) { SISDEL.showToast('El rango máximo es de un año', 'warning'); return false; }
                return true;
            }
            function longDate(text) { return parseYmd(text).toLocaleDateString('es-GT', { day: 'numeric', month: 'long', year: 'numeric' }); }
            function dateTime(iso) {
                if (!iso) return '';
                return new Date(iso).toLocaleString('es-GT', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
            // Fecha y hora ordenable para los CSV
            function stamp(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
            function emptyState(text) { return `<p class="text-center text-muted card" style="padding:2rem;">${esc(text)}</p>`; }
            function errorState() { return emptyState('No se pudo cargar la información. Revise su conexión e intente de nuevo.'); }
            function matches(query, ...fields) {
                if (!query) return true;
                return fields.some((f) => String(f || '').toLowerCase().includes(query));
            }

            const LOG_STATUS = {
                Authorized: { label: 'Autorizado', cls: 'badge-success' },
                Reminder: { label: 'Aviso de mora', cls: 'badge-warning' },
                Denied: { label: 'Denegado', cls: 'badge-danger' },
                Error: { label: 'Error', cls: 'badge-danger' }
            };
            const VISIT_STATUS = {
                pending: { label: 'Pendiente', cls: 'badge-info' },
                entered: { label: 'Ingresó', cls: 'badge-success' },
                completed: { label: 'Completada', cls: 'badge-success' }
            };
            const TO_ROLE = { all: 'Todos', vecino: 'Vecinos', policia: 'Guardias', admin: 'Administradores' };
            function logStatus(s) { return LOG_STATUS[s] || { label: s || 'Sin estado', cls: 'badge-info' }; }
            function visitStatus(s) { return VISIT_STATUS[s] || { label: s || 'Sin estado', cls: 'badge-info' }; }
            function badge(info) { return `<span class="badge ${info.cls}">${esc(info.label)}</span>`; }

            // CSV para Excel: UTF-8 con BOM. Las celdas que empiezan con = + - @ no se interpretan como formulas
            function csvCell(value) {
                let text = String(value ?? '');
                if (/^[=+\-@\t\r]/.test(text) && !/^[+-]?[\d\s().-]+$/.test(text)) text = "'" + text;
                return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
            }
            function downloadCsv(filename, header, rows) {
                const lines = [header, ...rows].map((row) => row.map(csvCell).join(','));
                const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            const fileSlug = condoName.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'condominio';

            // --- Datos base: usuarios (sin codigos de acceso) ---
            let users = [];
            let usersById = new Map();
            async function loadUsers() {
                users = await SISDEL.getUsers(condoId);
                usersById = new Map(users.map((u) => [u.id, u]));
            }
            function userLabel(userId) {
                const u = usersById.get(userId);
                return u ? u.name : '';
            }
            function morosoDays(u) {
                if (!u.morosoSince) return null;
                return Math.max(0, Math.floor((Date.now() - new Date(u.morosoSince).getTime()) / 86400000));
            }

            // --- Estadisticas ---
            async function renderStats() {
                const todayStr = ymd(today());
                const { fromIso, toIso } = isoRange(todayStr, todayStr);
                const [todayVisits, todayLogs] = await Promise.all([
                    SISDEL.getTodayVisits(condoId),
                    SISDEL.getCameraLogsBetween(condoId, fromIso, toIso, MAX_LOGS)
                ]);
                const vecinos = users.filter((u) => u.role === SISDEL.ROLES.VECINO);
                const morosos = vecinos.filter((u) => u.paymentStatus === SISDEL.PAYMENT_STATUS.MOROSO).length;
                const stat = (value, label, color) => `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="color:${color}">${value}</div></div>`;
                document.getElementById('statsGrid').innerHTML = [
                    stat(users.length, 'Usuarios', 'var(--primary-light)'),
                    stat(vecinos.length, 'Vecinos', 'var(--accent)'),
                    stat(morosos, 'Morosos', 'var(--danger)'),
                    stat(todayVisits.length, 'Visitas hoy', 'var(--warning)'),
                    stat(todayLogs ? todayLogs.length : '—', 'Accesos hoy', 'var(--success)')
                ].join('');
            }

            // --- Vista: Usuarios ---
            function renderUsers() {
                const q = document.getElementById('userSearch').value.trim().toLowerCase();
                const role = document.getElementById('userRole').value;
                const payment = document.getElementById('userPayment').value;
                const list = users.filter((u) =>
                    (!role || u.role === role)
                    && (!payment || u.paymentStatus === payment)
                    && matches(q, u.name, u.casa, u.phone, u.email));
                document.getElementById('usersNote').textContent = `${list.length} de ${users.length} usuarios`;
                const box = document.getElementById('usersList');
                if (!list.length) { box.innerHTML = emptyState('Sin resultados.'); return; }
                box.innerHTML = list.map((u) => {
                    const moroso = u.paymentStatus === SISDEL.PAYMENT_STATUS.MOROSO;
                    const days = moroso ? morosoDays(u) : null;
                    const contact = [u.phone && `Tel. ${esc(u.phone)}`, u.email && esc(u.email)].filter(Boolean).join(' · ');
                    return `
                    <div class="list-item">
                        <div class="avatar" style="${moroso ? 'background:var(--danger);' : ''}">${esc(u.name.charAt(0))}</div>
                        <div class="item-info">
                            <div class="item-name">${esc(u.name)}</div>
                            <div class="item-detail">${esc(SISDEL.getRoleName(u.role))}${u.casa ? ' · ' + esc(u.casa) : ''}</div>
                            ${contact ? `<div class="item-detail">${contact}</div>` : ''}
                        </div>
                        <div class="item-meta">
                            ${u.paymentStatus ? SISDEL.getPaymentBadge(u.paymentStatus) : ''}
                            ${u.active === false ? '<span class="badge badge-danger">Inactivo</span>' : ''}
                            ${days !== null ? `<span class="text-xs text-muted">Moroso hace ${days} día(s)</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            }
            ['userSearch', 'userRole', 'userPayment'].forEach((id) => {
                document.getElementById(id).addEventListener('input', renderUsers);
            });

            // --- Vista: Visitas ---
            let visits = [];
            function visitRow(v) {
                const st = visitStatus(v.status);
                const resident = userLabel(v.userId);
                const when = [SISDEL.formatDate(v.visitDate), v.visitTime ? String(v.visitTime).slice(0, 5) : ''].filter(Boolean).join(' ');
                const temporal = v.visitType === 'temporal' && v.endDate ? `<span class="text-xs text-muted">Temporal hasta ${esc(SISDEL.formatDate(v.endDate))}</span>` : '';
                return `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name">${esc(v.visitorName)}${v.visitorInfo ? ` <span class="text-xs text-muted">(${esc(v.visitorInfo)})</span>` : ''}</div>
                            <div class="item-detail">${esc(v.casa || 'Sin casa')}${resident ? ' · Autoriza: ' + esc(resident) : ''}</div>
                            <div class="item-detail">${esc(when)}${v.vehiclePlate ? ' · <span class="plate">' + esc(v.vehiclePlate) + '</span>' : ''}${v.enteredAt ? ' · Ingresó ' + esc(dateTime(v.enteredAt)) : ''}</div>
                        </div>
                        <div class="item-meta">${badge(st)}${temporal}</div>
                    </div>`;
            }
            function renderVisitsList() {
                const q = document.getElementById('visitSearch').value.trim().toLowerCase();
                const list = visits.filter((v) => matches(q, v.visitorName, v.visitorInfo, v.casa, v.vehiclePlate, userLabel(v.userId)));
                document.getElementById('visitsNote').textContent = `${list.length} visita(s)`;
                document.getElementById('visitsList').innerHTML = list.length ? list.map(visitRow).join('') : emptyState('No hay visitas en ese rango.');
            }
            async function loadVisits() {
                const from = document.getElementById('visitFrom').value;
                const to = document.getElementById('visitTo').value;
                if (!validRange(from, to)) return;
                document.getElementById('visitsNote').textContent = 'Cargando...';
                const result = await SISDEL.getVisitsBetween(condoId, from, to);
                if (!result) {
                    document.getElementById('visitsNote').textContent = '';
                    document.getElementById('visitsList').innerHTML = errorState();
                    return;
                }
                visits = result.sort((a, b) => `${b.visitDate} ${b.visitTime || ''}`.localeCompare(`${a.visitDate} ${a.visitTime || ''}`));
                renderVisitsList();
            }
            document.getElementById('btnVisitSearch').addEventListener('click', loadVisits);
            document.getElementById('visitSearch').addEventListener('input', renderVisitsList);

            // --- Vista: Vehiculos ---
            let vehicles = null;
            function renderVehicles() {
                if (!vehicles) return;
                const q = document.getElementById('vehicleSearch').value.trim().toLowerCase();
                const list = vehicles.filter((v) => {
                    const owner = usersById.get(v.userId);
                    return matches(q, v.plate, v.plateNorm, v.brand, v.model, owner && owner.name, owner && owner.casa);
                });
                document.getElementById('vehiclesNote').textContent = `${list.length} de ${vehicles.length} vehículos`;
                const box = document.getElementById('vehiclesList');
                if (!list.length) { box.innerHTML = emptyState('Sin resultados.'); return; }
                box.innerHTML = list.map((v) => {
                    const owner = usersById.get(v.userId);
                    const desc = [v.brand, v.model, v.color].filter(Boolean).join(' · ');
                    return `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name plate">${esc(v.plate)}</div>
                            <div class="item-detail">${esc(desc || 'Sin descripción')}</div>
                        </div>
                        <div class="item-meta">
                            <span class="text-sm">${esc(owner ? owner.name : 'Propietario no encontrado')}</span>
                            ${owner && owner.casa ? `<span class="text-xs text-muted">${esc(owner.casa)}</span>` : ''}
                            ${owner && owner.paymentStatus ? SISDEL.getPaymentBadge(owner.paymentStatus) : ''}
                        </div>
                    </div>`;
                }).join('');
            }
            async function loadVehicles() {
                document.getElementById('vehiclesNote').textContent = 'Cargando...';
                vehicles = (await SISDEL.getVehicles()).sort((a, b) => String(a.plate).localeCompare(String(b.plate)));
                renderVehicles();
            }
            document.getElementById('vehicleSearch').addEventListener('input', renderVehicles);

            // --- Vista: Accesos ---
            let logs = [];
            let logsCapped = false;
            function logRow(l) {
                return `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name plate">${esc(l.plate)}</div>
                            <div class="item-detail">${esc(l.reason || '')}</div>
                        </div>
                        <div class="item-meta">
                            ${badge(logStatus(l.status))}
                            <span class="text-xs text-muted">${esc(dateTime(l.createdAt))}</span>
                        </div>
                    </div>`;
            }
            function renderLogsList() {
                const q = document.getElementById('logSearch').value.trim().toLowerCase();
                const status = document.getElementById('logStatus').value;
                const list = logs.filter((l) => (!status || l.status === status) && matches(q, l.plate, l.reason));
                const note = document.getElementById('logsNote');
                note.textContent = logsCapped
                    ? `Se muestran los ${MAX_LOGS} registros más recientes del rango. Reduzca el rango para ver el resto.`
                    : `${list.length} registro(s)`;
                note.classList.toggle('warn', logsCapped);
                document.getElementById('logsList').innerHTML = list.length ? list.map(logRow).join('') : emptyState('No hay registros en ese rango.');
            }
            async function loadLogs() {
                const from = document.getElementById('logFrom').value;
                const to = document.getElementById('logTo').value;
                if (!validRange(from, to)) return;
                document.getElementById('logsNote').textContent = 'Cargando...';
                const { fromIso, toIso } = isoRange(from, to);
                const result = await SISDEL.getCameraLogsBetween(condoId, fromIso, toIso, MAX_LOGS);
                if (!result) {
                    document.getElementById('logsNote').textContent = '';
                    document.getElementById('logsList').innerHTML = errorState();
                    return;
                }
                logs = result;
                logsCapped = result.length >= MAX_LOGS;
                renderLogsList();
            }
            document.getElementById('btnLogSearch').addEventListener('click', loadLogs);
            document.getElementById('logSearch').addEventListener('input', renderLogsList);
            document.getElementById('logStatus').addEventListener('input', renderLogsList);

            // --- Vista: Mensajes ---
            async function loadMessages() {
                const msgs = await SISDEL.getMessages(condoId);
                document.getElementById('messagesNote').textContent = `${msgs.length} mensaje(s)`;
                const box = document.getElementById('messagesList');
                if (!msgs.length) { box.innerHTML = emptyState('No hay mensajes.'); return; }
                box.innerHTML = msgs.map((m) => `
                    <div class="list-item" style="flex-direction:column; align-items:flex-start; gap:0.5rem;">
                        <div style="display:flex; justify-content:space-between; width:100%; gap:1rem; flex-wrap:wrap;">
                            <strong style="color:var(--primary-light);">${esc(m.subject || 'Sin asunto')}</strong>
                            <span class="text-xs text-muted">${esc(dateTime(m.createdAt))}</span>
                        </div>
                        <p style="margin:0; color:var(--text-secondary); font-size:0.9rem; white-space:pre-wrap;">${esc(m.body)}</p>
                        <span class="text-xs text-muted">Para: ${esc(TO_ROLE[m.toRole] || m.toRole)} · De: ${esc(m.fromName)}${m.condominioId === 'all' ? ' · Mensaje general de SISDEL' : ''}</span>
                    </div>`).join('');
            }

            // --- Vista: Reportes ---
            let report = null;
            function setPreset(name) {
                const t = today();
                let from = t;
                let to = t;
                if (name === '7d') from = addDays(t, -6);
                else if (name === '30d') from = addDays(t, -29);
                else if (name === 'month') from = new Date(t.getFullYear(), t.getMonth(), 1);
                else if (name === 'lastMonth') {
                    from = new Date(t.getFullYear(), t.getMonth() - 1, 1);
                    to = new Date(t.getFullYear(), t.getMonth(), 0);
                }
                document.getElementById('reportFrom').value = ymd(from);
                document.getElementById('reportTo').value = ymd(to);
                document.querySelectorAll('#reportPresets .preset').forEach((b) => b.classList.toggle('active', b.dataset.preset === name));
            }
            document.querySelectorAll('#reportPresets .preset').forEach((b) => {
                b.addEventListener('click', () => { setPreset(b.dataset.preset); buildReport(); });
            });
            ['reportFrom', 'reportTo'].forEach((id) => document.getElementById(id).addEventListener('input', () => {
                document.querySelectorAll('#reportPresets .preset').forEach((b) => b.classList.remove('active'));
            }));
            document.getElementById('btnReport').addEventListener('click', buildReport);

            function countBy(items, keyOf) {
                const map = new Map();
                items.forEach((item) => {
                    const key = keyOf(item);
                    if (key) map.set(key, (map.get(key) || 0) + 1);
                });
                return map;
            }
            function table(headers, rows, numericCols = []) {
                if (!rows.length) return '<p class="text-sm text-muted">Sin datos en el periodo.</p>';
                const th = headers.map((h, i) => `<th class="${numericCols.includes(i) ? 'num' : ''}">${esc(h)}</th>`).join('');
                const body = rows.map((r) => `<tr>${r.map((c, i) => `<td class="${numericCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('');
                return `<div class="table-wrap"><table class="report-table"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
            }

            async function buildReport() {
                const from = document.getElementById('reportFrom').value;
                const to = document.getElementById('reportTo').value;
                if (!validRange(from, to)) return;
                const out = document.getElementById('reportOutput');
                out.innerHTML = emptyState('Generando reporte...');

                const { fromIso, toIso } = isoRange(from, to);
                const [rangeLogs, rangeVisits] = await Promise.all([
                    SISDEL.getCameraLogsBetween(condoId, fromIso, toIso, MAX_LOGS),
                    SISDEL.getVisitsBetween(condoId, from, to)
                ]);
                if (!rangeLogs || !rangeVisits) { report = null; out.innerHTML = errorState(); return; }
                report = { from, to, logs: rangeLogs, visits: rangeVisits, capped: rangeLogs.length >= MAX_LOGS, at: new Date() };

                const byStatus = countBy(rangeLogs, (l) => l.status);
                const authorized = byStatus.get('Authorized') || 0;
                const reminder = byStatus.get('Reminder') || 0;
                const denied = (byStatus.get('Denied') || 0) + (byStatus.get('Error') || 0);
                const entered = rangeVisits.filter((v) => v.status === 'entered' || v.status === 'completed').length;
                const pending = rangeVisits.filter((v) => v.status === 'pending').length;

                // Accesos por dia (fecha local)
                const days = new Map();
                for (let d = parseYmd(from); d <= parseYmd(to); d = addDays(d, 1)) days.set(ymd(d), { total: 0, ok: 0, rem: 0, den: 0 });
                rangeLogs.forEach((l) => {
                    const row = days.get(ymd(new Date(l.createdAt)));
                    if (!row) return;
                    row.total++;
                    if (l.status === 'Authorized') row.ok++;
                    else if (l.status === 'Reminder') row.rem++;
                    else row.den++;
                });
                const dayRows = [...days.entries()].reverse().filter(([, r]) => r.total > 0)
                    .map(([d, r]) => [esc(SISDEL.formatDate(d)), r.total, r.ok, r.rem, r.den]);

                // Placas con mas ingresos y placas denegadas
                const plateStats = new Map();
                rangeLogs.forEach((l) => {
                    if (!l.plate || l.plate === 'RESIDENTE') return;
                    const s = plateStats.get(l.plate) || { total: 0, denied: 0, last: '', reason: '' };
                    s.total++;
                    if (l.status === 'Denied') { s.denied++; if (!s.reason) s.reason = l.reason || ''; }
                    if (l.createdAt > s.last) s.last = l.createdAt;
                    plateStats.set(l.plate, s);
                });
                const topPlates = [...plateStats.entries()].sort((a, b) => b[1].total - a[1].total).slice(0, 10)
                    .map(([p, s]) => [`<span class="plate">${esc(p)}</span>`, s.total, esc(dateTime(s.last))]);
                const deniedPlates = [...plateStats.entries()].filter(([, s]) => s.denied > 0)
                    .sort((a, b) => b[1].denied - a[1].denied).slice(0, 10)
                    .map(([p, s]) => [`<span class="plate">${esc(p)}</span>`, s.denied, esc(s.reason)]);

                // Visitas por casa
                const byHouse = [...countBy(rangeVisits, (v) => v.casa || 'Sin casa').entries()]
                    .sort((a, b) => b[1] - a[1]).slice(0, 10).map(([c, n]) => [esc(c), n]);

                // Morosos al momento de generar el reporte
                const morosos = users.filter((u) => u.role === SISDEL.ROLES.VECINO && u.paymentStatus === SISDEL.PAYMENT_STATUS.MOROSO)
                    .sort((a, b) => (morosoDays(b) || 0) - (morosoDays(a) || 0))
                    .map((u) => [esc(u.name), esc(u.casa || ''), esc(u.morosoSince ? SISDEL.formatDate(u.morosoSince) : '—'), morosoDays(u) ?? '—']);

                const kpi = (label, value, color) => `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="color:${color}">${value}</div></div>`;
                const rangeText = from === to ? longDate(from) : `${longDate(from)} al ${longDate(to)}`;

                out.innerHTML = `
                    <div class="report-head">
                        <div>
                            <p class="print-only text-sm text-muted">${esc(condoName)} · Reporte de auditoría</p>
                            <h3>Reporte: ${esc(rangeText)}</h3>
                            <p class="text-xs text-muted">Generado el ${esc(dateTime(report.at.toISOString()))} por ${esc(session.userName || 'Auditor')}</p>
                            ${report.capped ? `<p class="result-note warn">El periodo tiene más de ${MAX_LOGS} accesos; los totales cubren solo los ${MAX_LOGS} más recientes. Reduzca el rango para un total exacto.</p>` : ''}
                        </div>
                        <div class="report-actions no-print">
                            <button class="btn btn-ghost btn-sm" data-export="logs">${ICONS.download} Accesos (CSV)</button>
                            <button class="btn btn-ghost btn-sm" data-export="visits">${ICONS.download} Visitas (CSV)</button>
                            <button class="btn btn-ghost btn-sm" data-export="users">${ICONS.download} Usuarios (CSV)</button>
                            <button class="btn btn-primary btn-sm" data-export="print">${ICONS.print} Imprimir / PDF</button>
                        </div>
                    </div>
                    <div class="stats-grid compact report-kpis">
                        ${kpi('Accesos registrados', rangeLogs.length, 'var(--primary-light)')}
                        ${kpi('Autorizados', authorized, 'var(--success)')}
                        ${kpi('Con aviso de mora', reminder, 'var(--warning)')}
                        ${kpi('Denegados', denied, 'var(--danger)')}
                        ${kpi('Visitas programadas', rangeVisits.length, 'var(--accent)')}
                        ${kpi('Visitas que ingresaron', entered, 'var(--success)')}
                        ${kpi('Visitas sin ingreso', pending, 'var(--text-muted)')}
                        ${kpi('Morosos actuales', morosos.length, 'var(--danger)')}
                    </div>
                    <div class="report-grid">
                        <div class="card report-card">
                            <h4>Accesos por día</h4>
                            ${table(['Fecha', 'Total', 'Autoriz.', 'Mora', 'Deneg.'], dayRows, [1, 2, 3, 4])}
                        </div>
                        <div class="card report-card">
                            <h4>Placas con más registros</h4>
                            ${table(['Placa', 'Registros', 'Último'], topPlates, [1])}
                        </div>
                        <div class="card report-card">
                            <h4>Placas denegadas</h4>
                            ${table(['Placa', 'Veces', 'Motivo'], deniedPlates, [1])}
                        </div>
                        <div class="card report-card">
                            <h4>Visitas por casa</h4>
                            ${table(['Casa', 'Visitas'], byHouse, [1])}
                        </div>
                        <div class="card report-card">
                            <h4>Vecinos morosos (hoy)</h4>
                            ${table(['Nombre', 'Casa', 'Desde', 'Días'], morosos, [3])}
                        </div>
                    </div>`;

                out.querySelectorAll('[data-export]').forEach((btn) => btn.addEventListener('click', () => exportReport(btn.dataset.export)));
            }

            function exportReport(kind) {
                if (kind === 'print') { window.print(); return; }
                if (!report) return;
                const suffix = report.from === report.to ? report.from : `${report.from}_a_${report.to}`;
                if (kind === 'logs') {
                    downloadCsv(`accesos-${fileSlug}-${suffix}.csv`,
                        ['Fecha y hora', 'Placa', 'Resultado', 'Detalle'],
                        report.logs.map((l) => [stamp(l.createdAt), l.plate, logStatus(l.status).label, l.reason || '']));
                } else if (kind === 'visits') {
                    downloadCsv(`visitas-${fileSlug}-${suffix}.csv`,
                        ['Fecha', 'Hora', 'Visitante', 'Detalle', 'Casa', 'Autoriza', 'Placa', 'Estado', 'Ingreso', 'Temporal hasta'],
                        report.visits.map((v) => [v.visitDate, v.visitTime ? String(v.visitTime).slice(0, 5) : '', v.visitorName, v.visitorInfo || '',
                            v.casa || '', userLabel(v.userId), v.vehiclePlate || '', visitStatus(v.status).label,
                            v.enteredAt ? stamp(v.enteredAt) : '', v.visitType === 'temporal' ? (v.endDate || '') : '']));
                } else if (kind === 'users') {
                    downloadCsv(`usuarios-${fileSlug}-${ymd(today())}.csv`,
                        ['Nombre', 'Rol', 'Casa', 'Teléfono', 'Email', 'Estado de pago', 'Moroso desde', 'Activo'],
                        users.map((u) => [u.name, SISDEL.getRoleName(u.role), u.casa || '', u.phone || '', u.email || '',
                            u.paymentStatus === 'moroso' ? 'Moroso' : u.paymentStatus === 'al_dia' ? 'Al día' : '',
                            u.morosoSince ? ymd(new Date(u.morosoSince)) : '', u.active === false ? 'No' : 'Sí']));
                }
            }

            // --- Pestanas: cada vista se carga la primera vez que se abre, ya con los usuarios cargados ---
            const usersReady = loadUsers();
            const loaded = new Set();
            const loaders = {
                usuarios: () => renderUsers(),
                visitas: () => loadVisits(),
                vehiculos: () => loadVehicles(),
                accesos: () => loadLogs(),
                mensajes: () => loadMessages(),
                reportes: () => buildReport()
            };
            function showView(name) {
                document.querySelectorAll('#mainTabs .tab').forEach((t) => {
                    const active = t.dataset.view === name;
                    t.classList.toggle('active', active);
                    // Centra la pestana activa en la barra sin mover la pagina
                    if (active) {
                        const bar = t.parentElement;
                        bar.scrollLeft += t.getBoundingClientRect().left - bar.getBoundingClientRect().left - (bar.clientWidth - t.offsetWidth) / 2;
                    }
                });
                document.querySelectorAll('.view').forEach((v) => { v.style.display = v.id === `view-${name}` ? '' : 'none'; });
                if (!loaded.has(name)) { loaded.add(name); usersReady.then(loaders[name]); }
            }
            document.querySelectorAll('#mainTabs .tab').forEach((t) => t.addEventListener('click', () => showView(t.dataset.view)));

            // Rangos por defecto
            const t = today();
            document.getElementById('visitFrom').value = ymd(addDays(t, -29));
            document.getElementById('visitTo').value = ymd(t);
            document.getElementById('logFrom').value = ymd(t);
            document.getElementById('logTo').value = ymd(t);
            setPreset('30d');

            showView('usuarios');
            await usersReady;
            await renderStats();
            SISDEL.reportPageLoad('auditor');
        });
    </script>
</body>

</html>
