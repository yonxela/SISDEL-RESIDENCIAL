<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISDEL - Sistema Financiero</title>
    <meta name="description" content="Sistema Financiero del condominio: cuotas, ingresos, egresos y reportes.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* La pagina es solo un marco: barra de SISDEL arriba y el Sistema Financiero (OIKOS) debajo */
        html, body { height: 100%; }
        body { min-height: 0; overflow: hidden; }
        .fin-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
            padding: 0.6rem 1rem; border-bottom: 1px solid var(--border-strong);
            background: var(--bg-surface-solid); flex-wrap: wrap;
        }
        .fin-brand { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
        .fin-brand .brand-icon { width: 34px; height: 34px; flex-shrink: 0; }
        .fin-brand h1 { font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fin-brand p { font-size: 0.72rem; color: var(--text-muted); }
        .fin-actions { display: flex; align-items: center; gap: 0.5rem; }
        .btn-sm { padding: 0.5rem 0.9rem; font-size: 0.85rem; }

        .sync-pill {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.3rem 0.7rem; border-radius: var(--radius-full);
            font-size: 0.72rem; font-weight: 700; background: var(--bg-item); color: var(--text-secondary);
        }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .sync-pill[data-state="ok"] .sync-dot { background: var(--success); }
        .sync-pill[data-state="saving"] .sync-dot, .sync-pill[data-state="loading"] .sync-dot { background: var(--warning); }
        .sync-pill[data-state="error"] .sync-dot, .sync-pill[data-state="denied"] .sync-dot, .sync-pill[data-state="offline"] .sync-dot { background: var(--danger); }

        .fin-banner {
            display: none; align-items: center; justify-content: center; gap: 0.75rem;
            padding: 0.5rem 1rem; background: var(--info-bg); color: var(--info);
            font-size: 0.85rem; font-weight: 600; flex-wrap: wrap;
        }
        .fin-banner.show { display: flex; }

        .fin-frame { flex: 1; min-height: 0; position: relative; background: #0f172a; }
        /* Reporte "QR de panico por vecino" abierto desde Finanzas > Reportes (el mismo de Administracion > Reportes): encima de OIKOS */
        .pq-report { position: fixed; inset: 0; z-index: 70; overflow-y: auto; background: var(--bg-app, #0f172a); }
        .pq-report[hidden] { display: none; }
        .pq-report-inner { max-width: 1200px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
        .pq-report-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
        .pq-report-top p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
        #pqReportMount .rp-back { display: none; }
        .fin-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
        .fin-frame iframe.pendiente { visibility: hidden; }
        .fin-message {
            position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1rem;
            align-items: center; justify-content: center; text-align: center; padding: 1.5rem;
            color: #cbd5e1; font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            .label-wide { display: none; }
            /* SISDEL: en el celular la barra va en una sola linea y ocupa poco (pedido del usuario el 2026-11-20): el nombre del
               condominio se corta con puntos suspensivos, sin el subtitulo, y con todo guardado solo queda el punto verde */
            .fin-bar { flex-wrap: nowrap; padding: 0.4rem 0.75rem; gap: 0.5rem; }
            .fin-brand { flex: 1; }
            .fin-brand > div:last-child { min-width: 0; }
            .fin-brand .brand-icon { width: 28px; height: 28px; }
            .fin-brand h1 { font-size: 0.9rem; }
            .fin-brand p { display: none; }
            .fin-actions { flex-shrink: 0; gap: 0.35rem; }
            .sync-pill[data-state="ok"] #syncText { display: none; }
            .sync-pill[data-state="ok"] { padding: 0.45rem; }
            #btnBack { padding: 0.45rem 0.6rem; }
        }
    </style>
</head>

<body>
    <header class="fin-bar">
        <div class="fin-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <line x1="12" y1="1" x2="12" y2="23" />
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
            </div>
            <div>
                <h1 id="condoName">Sistema Financiero</h1>
                <p>Sistema Financiero</p>
            </div>
        </div>
        <div class="fin-actions">
            <span class="sync-pill" id="syncPill" data-state="loading" title="Estado de la copia en la nube">
                <span class="sync-dot"></span><span id="syncText">Cargando</span>
            </span>
            <button class="btn btn-ghost btn-sm" id="btnBack" title="Volver al panel de administración">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                <span class="label-wide">Volver al panel</span>
            </button>
        </div>
    </header>

    <div class="fin-banner" id="remoteBanner">
        <span>Otro usuario hizo cambios en el Sistema Financiero.</span>
        <button class="btn btn-primary btn-sm" id="btnReload">Actualizar</button>
    </div>

    <!-- QR de panico por vecino (reportes.panico_qr): quien trabaja en Finanzas sin entrar a Administracion lo abre desde
         Finanzas > Reportes > Seguridad. Es el mismo reporte de Administracion > Reportes (reportes-ui.js) -->
    <section class="pq-report" id="pqReport" hidden aria-label="QR de pánico por vecino">
        <div class="pq-report-inner">
            <div class="pq-report-top modal-header">
                <p>Finanzas · Reportes · Seguridad</p>
                <button type="button" class="btn btn-ghost btn-icon modal-close" id="pqReportClose" title="Cerrar" aria-label="Cerrar">&times;</button>
            </div>
            <div id="pqReportMount"></div>
        </div>
    </section>

    <main class="fin-frame" id="frameBox">
        <div class="fin-message" id="frameMessage">Cargando datos financieros...</div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>
    <script src="firebase-client.js?v=20260929"></script>
    <script src="privilegios.js?v=20261122c"></script>
    <script src="sisdel-core.js?v=20261122c"></script>
    <script src="finanzas-datos.js?v=20261112a"></script>
    <script src="finanzas-sync.js?v=20261122a"></script>
    <script src="finanzas-bloqueo.js?v=20261122a"></script>
    <script src="finanzas-bancos.js?v=20261116a"></script>
    <script src="finanzas-chats.js?v=20261117a"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await SISDEL.requireAuth([], 'finanzas.html');
            if (!session) return;

            const condoId = session.condominioId;
            // El nombre vigente del condominio (pudo cambiar despues de entrar: solo el programador lo cambia, con la clave
            // master). OIKOS lo usa en reportes y recibos, y las reglas solo le dejan guardar el nombre oficial.
            let condoName = session.condominioName || '';
            try { const condo = await SISDEL.getCondominio(condoId); if (condo && condo.name) condoName = condo.name; } catch { /* se queda el de la sesion */ }
            document.getElementById('condoName').textContent = condoName || 'Sistema Financiero';

            // Quien usa OIKOS: el descuento de mora guarda quien lo hizo (las reglas exigen que sea la sesion: el id de la
            // cuenta, 'master' para el Master) y el reporte de descuentos lo muestra
            window.sisdelWho = session.role === 'master'
                ? { id: 'master', name: 'Master (programador)', role: 'master' }
                : { id: String(session.userId || ''), name: session.userName || '', role: session.role || '' };

            // OIKOS (el iframe) pide aqui confirmar la clave de quien lo usa antes de aplicar la cuota del mes en cobro
            // manual: la verifica el servidor (confirmOwnCode, functions/src/auth.js) y solo dice si es la clave de esa persona
            window.sisdelConfirmCode = async (code) => {
                const result = await window.sisdelFirebase.functions.httpsCallable('confirmOwnCode')({ code });
                return result.data || { ok: false };
            };

            // OIKOS (el iframe) manda aqui los recordatorios de WhatsApp a todos los residentes: el servidor (functions/src/
            // recordatorios.js) toma los telefonos de la ficha de cada vecino y los manda de a poco desde el WhatsApp del
            // condominio. Cada llamada responde { ok: true, ... } o { ok: false, error } con el motivo en español.
            const callServer = (name) => async (payload) => {
                try {
                    const result = await window.sisdelFirebase.functions.httpsCallable(name)(payload);
                    return { ok: true, ...(result.data || {}) };
                } catch (error) {
                    return { ok: false, error: String((error && error.message) || 'No se pudo completar. Intente de nuevo.').replace(/\s*\[\d{3}\]\s*$/, '') };
                }
            };
            window.sisdelWhatsApp = {
                start: callServer('startReminderCampaign'),
                test: callServer('sendReminderTest'),
                one: callServer('sendReminderOne'),
                // La clave de acceso de un vecino: el servidor la lee y arma el mensaje (el navegador no la manda); pide usuarios.codigos
                sendCode: callServer('sendAccessCode'),
                control: callServer('controlReminderCampaign'),
                // Si WhatsApp esta conectado y cuantos mensajes hay en la cola de UltraMsg
                status: callServer('checkWhatsAppConnection'),
                // Que paso de verdad con los mensajes de un envio y reenviar solo a los que no recibieron
                reconcile: callServer('reconcileReminderCampaign'),
                resend: callServer('resendReminderCampaign'),
                // A quienes se les mando un envio y que paso con cada uno (sin el texto): el listado "quienes recibieron"
                recipients: async ({ campaignId }) => {
                    try {
                        const snap = await window.sisdelFirebase.db.collection('condominios').doc(condoId).collection('recordatorios_envios')
                            .doc(String(campaignId)).collection('destinatarios').get();
                        return {
                            ok: true,
                            items: snap.docs.map((d) => {
                                const x = d.data();
                                return { id: d.id, name: x.name || '', casa: x.casa || '', phoneTail: x.phoneTail || '', status: x.status || '', delivery: x.delivery || null, deliveryReason: x.deliveryReason || '', reason: x.reason || '', error: x.error || '', sentAt: x.sentAt || '' };
                            })
                        };
                    } catch (error) {
                        return { ok: false, error: 'No se pudo leer el listado. Revise su conexión y su permiso de recordatorios.' };
                    }
                },
                // El ultimo envio del condominio, en vivo (lo lee quien tiene el privilegio de recordatorios)
                watch: (callback) => {
                    try {
                        return window.sisdelFirebase.db.collection('condominios').doc(condoId).collection('recordatorios_envios')
                            .orderBy('createdAt', 'desc').limit(1)
                            .onSnapshot((snap) => callback(snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() }), () => callback(null));
                    } catch (error) { callback(null); return () => {}; }
                }
            };

            // Entregar la clave de acceso con el QR de panico (ventana "Codigo del boton de panico" de OIKOS): al darle la tarjeta al
            // vecino, la oficina activa la entrega y la PRIMERA vez que el vecino escanea el QR ve su clave una sola vez (panico.html).
            // Solo con "Ver y cambiar codigos de acceso" (usuarios.codigos), que el servidor (panicCodeDelivery) tambien exige
            window.sisdelPanicDelivery = null;
            if (SISDEL.can('usuarios.codigos')) {
                const delivery = callServer('panicCodeDelivery');
                window.sisdelPanicDelivery = {
                    status: (residentId) => delivery({ action: 'status', residentId: String(residentId), condoId }),
                    arm: (residentId) => delivery({ action: 'arm', residentId: String(residentId), condoId }),
                    cancel: (residentId) => delivery({ action: 'cancel', residentId: String(residentId), condoId })
                };
            }

            // Reporte "QR de pánico por vecino" dentro de Finanzas (pedido del usuario el 2026-11-22: un operador de oficina con el
            // privilegio del reporte trabaja solo en Finanzas y no lo veia: vive en Administracion > Reportes, a donde no entra).
            // OIKOS lo ofrece en Reportes > Seguridad y llama aqui. Es el mismo reporte (reportes-ui.js, con su interruptor de entrega
            // de claves para quien ve las claves); sus scripts se cargan la primera vez que se abre. Pide los mismos privilegios.
            window.sisdelPanicQrReport = null;
            if (SISDEL.can('reportes.ver') && SISDEL.can('reportes.panico_qr') && SISDEL.can('usuarios.ver')) {
                const panel = document.getElementById('pqReport');
                const loadScript = (src) => new Promise((resolve, reject) => {
                    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                    const tag = document.createElement('script');
                    tag.src = src; tag.onload = () => resolve(); tag.onerror = () => reject(new Error(`No se pudo cargar ${src}`));
                    document.head.appendChild(tag);
                });
                let ready = null;
                let mounted = null;
                let users = [];
                const prepare = () => {
                    if (!ready) {
                        ready = (async () => {
                            for (const src of ['sisdel-busqueda.js?v=20261115a', 'reportes-export.js?v=20261115a', 'panico-qr.js?v=20261122a', 'rondas-core.js?v=20261117c', 'reportes-ui.js?v=20261122c']) await loadScript(src);
                            if (typeof SisdelRondas !== 'undefined' && SisdelRondas.init) SisdelRondas.init(session);
                            users = await SISDEL.getUsers(condoId);
                        })().catch((error) => { ready = null; throw error; });
                    }
                    return ready;
                };
                const close = () => { panel.hidden = true; document.removeEventListener('keydown', onKey); };
                const onKey = (e) => { if (e.key === 'Escape') close(); };
                document.getElementById('pqReportClose').addEventListener('click', close);
                window.sisdelPanicQrReport = {
                    async open() {
                        panel.hidden = false;
                        panel.scrollTop = 0;
                        document.addEventListener('keydown', onKey);
                        const mount = document.getElementById('pqReportMount');
                        if (!mounted) mount.innerHTML = '<p class="text-muted" style="padding:2rem 0; text-align:center;">Cargando el reporte...</p>';
                        try {
                            await prepare();
                            if (!mounted) mounted = SisdelReportes.mount(mount, { condominioId: condoId, condoName, userName: session.userName, getUsers: () => users });
                            mounted.show('panico-qr');
                        } catch (error) {
                            console.error(error);
                            mount.innerHTML = '<p style="padding:2rem 0; text-align:center; color:var(--danger);">No se pudo abrir el reporte. Revise su conexión e intente de nuevo.</p>';
                        }
                    },
                    close
                };
            }

            const STATUS_TEXT = {
                loading: 'Cargando', ok: 'Guardado en la nube', saving: 'Guardando...',
                offline: 'Sin conexión', error: 'Error al guardar, reintentando', denied: 'Sin permisos'
            };
            const pill = document.getElementById('syncPill');
            function setStatus(state) {
                pill.dataset.state = state;
                document.getElementById('syncText').textContent = STATUS_TEXT[state] || state;
                if (state === 'denied') SISDEL.showToast('La sesión venció o ya no tiene permisos. Vuelva a iniciar sesión.', 'warning');
            }

            const frameBox = document.getElementById('frameBox');
            const message = document.getElementById('frameMessage');
            let iframe = null;

            // Acceso directo desde el panel Reportes del administrador (admin.html): finanzas.html#reportes/<reporte>.
            // Solo la primera vez que se abre; OIKOS decide si el usuario puede ver ese reporte (finanzas-bloqueo.js).
            let deepLinkDone = false;
            function openReportFromHash(win) {
                if (deepLinkDone) return;
                deepLinkDone = true;
                const match = /^#reportes\/(income|expense-cat|month-balance|morosos|mora-list|pay-map|owners|marbetes|mora-discounts|account-statement|resumen)$/.exec(window.location.hash);
                if (!match) return;
                try {
                    if (match[1] === 'resumen') {
                        if (!SISDEL.can('finanzas.reportes_resumen')) return;
                        win.navigate('reports');
                        win.openReportModal();
                    } else {
                        win.navigate('reports');
                        win.selectReport(match[1]);
                    }
                } catch (error) {
                    console.error('Sistema Financiero: no se pudo abrir el reporte pedido', error);
                }
            }

            // OIKOS se abre con el condominio en la URL: su bloque de entrada salta el login
            // propio y aterriza en el panel del condominio (ver finanzas/index.html).
            function mountOikos() {
                if (iframe) iframe.remove();
                const params = new URLSearchParams({
                    msid: condoId,
                    msname: condoName || 'Condominio',
                    msdirector: session.userName || 'Administrador'
                });
                iframe = document.createElement('iframe');
                iframe.title = 'Sistema Financiero';
                iframe.src = `finanzas/index.html?${params.toString()}`;
                // Oculto hasta aplicar los privilegios del usuario dentro de OIKOS (ver finanzas-bloqueo.js)
                iframe.classList.add('pendiente');
                const mounted = iframe;
                mounted.addEventListener('load', () => {
                    // OIKOS debe estar trabajando sobre la memoria de esta pagina (finanzas-datos.js). Si no (no cargo
                    // esa parte), no se muestra: lo que se registrara ahi no llegaria a la nube.
                    let usesMemory = false;
                    try { usesMemory = mounted.contentWindow.eval('typeof sisdelMem === "function" && sisdelMem() !== null') === true; } catch { usesMemory = false; }
                    if (!usesMemory) {
                        mounted.remove();
                        if (iframe === mounted) iframe = null;
                        message.style.display = '';
                        message.textContent = 'No se pudo abrir el Sistema Financiero. Revise su conexión y recargue la página.';
                        setStatus('error');
                        return;
                    }
                    try {
                        SisdelFinanzasBloqueo.install(mounted.contentWindow, (key) => SISDEL.can(key));
                    } catch (error) {
                        // Sin el bloqueo de pantalla las reglas y el filtro de escritura siguen protegiendo los datos
                        console.error('Sistema Financiero: no se pudieron aplicar los privilegios en pantalla', error);
                    }
                    try { exitToHome(mounted.contentWindow); } catch (error) { console.error('Sistema Financiero: no se pudo cambiar el boton de salida', error); }
                    openReportFromHash(mounted.contentWindow);
                    mounted.classList.remove('pendiente');
                });
                // Mismo aislamiento que en MULTISYS: sin allow-top-navigation, OIKOS no puede navegar esta pagina
                // allow-popups-to-escape-sandbox: las ventanas que OIKOS abre (WhatsApp, impresion de reportes) NO heredan el
                // sandbox. Sin eso WhatsApp respondia "Se bloqueó api.whatsapp.com" (ERR_BLOCKED_BY_RESPONSE) al pulsar Enviar.
                iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals');
                message.style.display = 'none';
                frameBox.appendChild(iframe);
            }

            // El boton "Cerrar Sesión" de OIKOS (menu lateral) pasa a ser "Regresar al panel principal": la sesion se cierra desde el
            // panel principal. Si el Sistema Financiero es el unico panel del usuario no hay a donde volver y se queda "Cerrar Sesión".
            function exitToHome(win) {
                const home = SISDEL.homePage();
                if (!home || home === 'finanzas.html' || home === 'index.html') return;
                const doc = win.document;
                const label = 'Regresar al panel principal';
                const apply = () => {
                    const text = doc.getElementById('lbl-logout');
                    if (text && text.textContent !== label) text.textContent = label;
                    const button = doc.querySelector('button[onclick="logout()"]');
                    if (!button) return;
                    button.setAttribute('data-sisdel-exit', '1');
                    button.setAttribute('title', label);
                    const icon = button.querySelector('i');
                    if (icon && !icon.classList.contains('fa-arrow-left')) icon.className = 'fas fa-arrow-left';
                };
                apply();
                new win.MutationObserver(apply).observe(doc.body, { childList: true, subtree: true, characterData: true });
                // En fase de captura: antes de que OIKOS ejecute logout() (que borraria la sesion de SISDEL)
                doc.addEventListener('click', (event) => {
                    if (!event.target.closest || !event.target.closest('[data-sisdel-exit]')) return;
                    event.preventDefault();
                    event.stopPropagation();
                    leave(() => { window.location.href = home; });
                }, true);
            }

            // Bancos (finanzas-bancos.js): cuentas, movimientos a mano y cuenta favorita, en tiempo real. OIKOS los lee desde su
            // iframe (window.parent.sisdelBancos). Solo si el usuario puede verlos; las reglas protegen cada escritura.
            window.sisdelBancos = null;
            if (SISDEL.can('finanzas.bancos_ver') && typeof SisdelFinanzasBancos !== 'undefined') {
                try {
                    window.sisdelBancos = SisdelFinanzasBancos.start(condoId, { userId: session.userId, userName: session.userName, role: session.role });
                } catch (error) {
                    console.error('Sistema Financiero: no se pudieron abrir los bancos', error);
                }
            }

            // Chat de WhatsApp con los residentes (finanzas-chats.js): la lista de chats y los mensajes en tiempo real. OIKOS los
            // lee desde su iframe (window.parent.sisdelChats). Solo con el privilegio; enviar lo hace el servidor.
            window.sisdelChats = null;
            if (SISDEL.can('finanzas.whatsapp_chat') && typeof SisdelFinanzasChats !== 'undefined') {
                try {
                    window.sisdelChats = SisdelFinanzasChats.start(condoId);
                } catch (error) {
                    console.error('Sistema Financiero: no se pudieron abrir los chats de WhatsApp', error);
                }
            }

            // Claves de acceso de los residentes (coleccion codigos), en tiempo real: OIKOS las muestra bajo el nombre de cada
            // residente (window.parent.sisdelCodes.watch). Solo con "Ver y cambiar codigos de acceso" (usuarios.codigos) y con
            // poder ver residentes: las reglas de codigos tambien lo exigen (y solo dejan leer las de vecinos sin asignar
            // privilegios). La escucha se abre cuando OIKOS la pide por primera vez, no al cargar la pagina.
            window.sisdelCodes = null;
            if (SISDEL.can('usuarios.codigos') && SISDEL.can('finanzas.residentes_ver')) {
                const codeListeners = new Set();
                let lastCodes = null;
                let stopCodes = null;
                window.sisdelCodes = {
                    watch(callback) {
                        if (typeof callback !== 'function') return () => {};
                        codeListeners.add(callback);
                        if (lastCodes) { try { callback(lastCodes); } catch (error) { console.error(error); } }
                        if (!stopCodes) {
                            stopCodes = window.sisdelFirebase.db.collection('codigos')
                                .where('condominioId', '==', condoId).where('role', '==', 'vecino')
                                .onSnapshot((snap) => {
                                    const map = new Map();
                                    snap.docs.forEach((d) => { const x = d.data(); if (x && x.userId) map.set(String(x.userId), d.id); });
                                    lastCodes = map;
                                    codeListeners.forEach((fn) => { try { fn(map); } catch (error) { console.error(error); } });
                                }, (error) => { console.warn('Sistema Financiero: no se pudieron leer las claves de los residentes', error && error.code); });
                        }
                        return () => { codeListeners.delete(callback); };
                    }
                };
            }

            // Vehiculos de los vecinos (coleccion vehiculos), en tiempo real: los usa el reporte "Impresion de marbetes por fase"
            // de OIKOS (window.parent.sisdelVehicles.watch). Solo con "Ver vehiculos" (vehiculos.ver, que tambien exigen las
            // reglas) y el privilegio del reporte. La escucha se abre cuando OIKOS la pide (al abrir el reporte), no al cargar
            // la pagina. El callback recibe la lista ({ id, userId, plate, brand, model, color, marbeteCode }) o, si no se pudo
            // leer, null y el codigo del error.
            window.sisdelVehicles = null;
            if (SISDEL.can('vehiculos.ver') && SISDEL.can('finanzas.reportes_marbetes')) {
                const vehicleListeners = new Set();
                let lastVehicles = null;
                let stopVehicles = null;
                const text = (v) => (v == null ? '' : String(v));
                window.sisdelVehicles = {
                    watch(callback) {
                        if (typeof callback !== 'function') return () => {};
                        vehicleListeners.add(callback);
                        if (lastVehicles) { try { callback(lastVehicles); } catch (error) { console.error(error); } }
                        if (!stopVehicles) {
                            stopVehicles = window.sisdelFirebase.db.collection('condominios').doc(condoId).collection('vehiculos')
                                .onSnapshot((snap) => {
                                    lastVehicles = snap.docs.map((d) => {
                                        const x = d.data() || {};
                                        return { id: d.id, userId: text(x.userId), plate: text(x.plate), brand: text(x.brand), model: text(x.model), color: text(x.color), marbeteCode: text(x.marbeteCode) };
                                    });
                                    vehicleListeners.forEach((fn) => { try { fn(lastVehicles); } catch (error) { console.error(error); } });
                                }, (error) => {
                                    console.warn('Sistema Financiero: no se pudieron leer los vehiculos de los vecinos', error && error.code);
                                    vehicleListeners.forEach((fn) => { try { fn(null, (error && error.code) || 'error'); } catch (e) { console.error(e); } });
                                });
                        }
                        return () => { vehicleListeners.delete(callback); };
                    }
                };
            }

            // Vehiculos de los residentes (pestana Vehiculos del formulario del residente de OIKOS, pedido del usuario el 2026-11-20):
            // OIKOS los lee y escribe por window.parent.sisdelResidentVehicles (no confundir con sisdelVehicles, que es la escucha del reporte de marbetes). Solo con "Ver vehiculos" (vehiculos.ver) y poder ver
            // residentes; `can` dice que mas puede hacer este usuario (registrar, editar, quitar: cada uno su privilegio, y las reglas
            // de la coleccion vehiculos tambien lo exigen). Los datos son los de siempre (placa, marca, modelo y color: los usa la garita).
            window.sisdelResidentVehicles = null;
            if (SISDEL.can('vehiculos.ver') && SISDEL.can('finanzas.residentes_ver')) {
                const vehiclesRef = () => window.sisdelFirebase.db.collection('condominios').doc(condoId).collection('vehiculos');
                const cleanText = (v, max) => String(v == null ? '' : v).trim().slice(0, max);
                const plateOf = (v) => String(v && v.plate || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                window.sisdelResidentVehicles = {
                    can: { create: SISDEL.can('vehiculos.crear'), edit: SISDEL.can('vehiculos.editar'), remove: SISDEL.can('vehiculos.eliminar') },
                    // Los vehiculos de un vecino, los mas viejos primero. Si la lectura falla se avisa (no se muestra una lista vacia)
                    async list(userId) {
                        const snap = await vehiclesRef().where('userId', '==', String(userId)).get();
                        return snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
                    },
                    // Los vehiculos del condominio con esa placa (ya sin guiones ni espacios): para avisar si ya esta en otro vecino
                    async findPlate(plate) {
                        const norm = plateOf({ plate });
                        if (!norm) return [];
                        const snap = await vehiclesRef().where('plateNorm', '==', norm).get();
                        return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                    },
                    // Registra un vehiculo con su marbete (el mismo createVehicle de siempre); devuelve el vehiculo o null
                    async create(userId, v) {
                        return SISDEL.createVehicle(String(userId), condoId, plateOf(v), cleanText(v.brand, 40), cleanText(v.model, 40), cleanText(v.color, 30));
                    },
                    // Cambia la placa, marca, modelo y color de un vehiculo (el marbete no cambia); true si se guardo
                    async update(vehicleId, v) {
                        const plate = plateOf(v);
                        if (!vehicleId || !plate) return false;
                        try {
                            await vehiclesRef().doc(String(vehicleId)).update({
                                plate, plateNorm: plate, brand: cleanText(v.brand, 40), model: cleanText(v.model, 40), color: cleanText(v.color, 30),
                                updatedAt: new Date().toISOString()
                            });
                            return true;
                        } catch (error) {
                            console.warn('Sistema Financiero: no se pudo cambiar el vehiculo', error && error.code);
                            return false;
                        }
                    },
                    // Quita un vehiculo (el mismo deleteVehicle de siempre); true si se borro
                    async remove(vehicleId) { return SISDEL.deleteVehicle(String(vehicleId)); }
                };
            }

            const banner = document.getElementById('remoteBanner');
            // Aviso de lo que se descarto por falta de privilegio (como maximo uno cada 8 s)
            let lastBlockedToast = 0;
            // finanzas.html?recargar=1 rehace la copia de este equipo desde la nube (soporte)
            const reload = new URLSearchParams(window.location.search).get('recargar') === '1';
            const sync = SisdelFinanzas.start(condoId, {
                onStatus: setStatus,
                reload,
                // La primera vez (o al rehacer la copia) los movimientos se bajan por paginas: se muestra el avance
                onProgress: (count) => {
                    if (iframe || !count) return;
                    message.textContent = `Cargando datos financieros... ${count.toLocaleString('es-GT')} movimientos`;
                },
                // Un cambio que el usuario no puede hacer no se sube: la copia local vuelve a ser la de la nube
                can: (key) => SISDEL.can(key),
                onBlocked: ({ count, silent }) => {
                    if (silent || Date.now() - lastBlockedToast < 8000) return;
                    lastBlockedToast = Date.now();
                    SISDEL.showToast(`Se descartó ${count === 1 ? 'un cambio' : count + ' cambios'}: su usuario no tiene el privilegio para hacerlo.`, 'warning');
                },
                // Un residente agregado en OIKOS es un vecino nuevo de SISDEL, con su codigo de acceso
                newAccessCode: (name) => SISDEL.generateAccessCode(condoName, name),
                onResidentCreated: (name, code) => {
                    SISDEL.showToast(`${name} quedó registrado como vecino en SISDEL. Código de acceso: ${code}`, 'success');
                },
                // Los vehiculos que se agregan al crear un residente en OIKOS (pestana Vehiculos) quedan como vehiculos del vecino:
                // cada uno con su placa, marca, modelo y color (antes solo eran placas sueltas, texto)
                createVehicle: (userId, item) => {
                    const v = typeof item === 'string' ? { plate: item } : (item || {});
                    return SISDEL.createVehicle(userId, condoId, String(v.plate || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(), String(v.brand || '').slice(0, 40), String(v.model || '').slice(0, 40), String(v.color || '').slice(0, 30));
                },
                onRemoteChange: (kind) => {
                    if (!iframe) return;
                    // OIKOS vacio una lista (p. ej. "Borrar todo"): se restauro desde la nube y se recarga
                    if (kind === 'restored') {
                        SISDEL.showToast('Los datos financieros se conservan en la nube y se restauraron.', 'info');
                        mountOikos();
                        return;
                    }
                    banner.classList.add('show');
                }
            });

            try {
                await sync.ready;
                // La copia ya se rehizo: se quita ?recargar=1 para que recargar la pagina no vuelva a bajar todo
                if (reload) { try { history.replaceState(null, '', window.location.pathname + window.location.hash); } catch { /* sin historial */ } }
                mountOikos();
            } catch (error) {
                console.error('Sistema Financiero: no se pudo cargar', error);
                setStatus('error');
                const offline = navigator.onLine === false || String(error && error.message) === 'timeout';
                const denied = String(error && error.code || '').includes('permission-denied');
                message.innerHTML = '';
                const text = document.createElement('p');
                text.textContent = denied
                    ? 'Sin permisos para el Sistema Financiero. Vuelva a iniciar sesión.'
                    : offline
                        ? 'Sin conexión: el Sistema Financiero necesita internet para abrir.'
                        : 'No se pudieron cargar los datos financieros.';
                const retry = document.createElement('button');
                retry.className = 'btn btn-primary btn-sm';
                retry.textContent = 'Reintentar';
                retry.addEventListener('click', () => window.location.reload());
                message.append(text, retry);
                return;
            }

            document.getElementById('btnReload').addEventListener('click', async () => {
                banner.classList.remove('show');
                await sync.waitIdle(5000);
                mountOikos();
            });

            async function leave(action) {
                setStatus('saving');
                const saved = await sync.waitIdle(10000);
                // Lo pendiente queda anotado en este equipo; si este navegador no deja guardar nada, se dice claro
                const warning = sync.pendingIsSafe()
                    ? 'Hay cambios que todavía no se guardaron en la nube. Quedan en este equipo y se subirán la próxima vez que abra el Sistema Financiero.\n\n¿Salir de todos modos?'
                    : 'Hay cambios que todavía no se guardaron en la nube y este navegador no permite guardarlos en el equipo: si sale ahora SE PIERDEN.\n\nEspere a que vuelva la conexión y diga "Guardado en la nube".\n\n¿Salir de todos modos?';
                if (!saved && !confirm(warning)) {
                    return;
                }
                action();
            }

            // Vuelve al panel de inicio de este usuario (un contador, por ejemplo, no entra a admin.html)
            const backTo = SISDEL.homePage();
            if (backTo === 'finanzas.html') document.getElementById('btnBack').style.display = 'none'; // su unico panel: sale con "Cerrar sesion" de OIKOS
            document.getElementById('btnBack').addEventListener('click', () => leave(() => { window.location.href = backTo; }));

            // "Cerrar sesión" dentro de OIKOS: OIKOS ya borro el sessionStorage (que comparte
            // con esta pagina, incluida la sesion de SISDEL), asi que se cierra la sesion completa.
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin || !iframe || event.source !== iframe.contentWindow) return;
                if (!event.data || event.data.type !== 'multisys:oikos-logout') return;
                leave(() => SISDEL.logout());
            });

            window.addEventListener('beforeunload', (event) => {
                if (sync.hasPending()) { event.preventDefault(); event.returnValue = ''; }
            });
            // Si el navegador restaura la pagina desde su cache al volver atras, se recarga completa
            window.addEventListener('pageshow', (event) => { if (event.persisted) window.location.reload(); });

            SISDEL.reportPageLoad('finanzas');
        });
    </script>
