<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>SISDEL - Rondas del Guardia</title>
    <meta name="description" content="App del guardia: turnos, rondas, puntos de control, incidentes y botón de pánico.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        body { padding-bottom: 96px; }
        .wrap { max-width: 640px; margin: 0 auto; width: 100%; padding: 0 1rem; }
        .g-bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 0; border-bottom: 1px solid var(--border-subtle); }
        .g-bar h1 { font-size: 1.05rem; font-weight: 800; }
        .g-bar p { font-size: 0.75rem; color: var(--text-muted); }
        .btn-sm { padding: 0.5rem 0.85rem; font-size: 0.85rem; }
        .g-card { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 1rem; margin-top: 1rem; }
        .g-card h2 { font-size: 1rem; margin-bottom: 0.6rem; }
        .g-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
        .g-muted { color: var(--text-muted); font-size: 0.8rem; }
        .gps-pill { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 700; padding: 0.3rem 0.65rem; border-radius: 999px; background: var(--bg-item); }
        .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .gps-pill[data-q="good"] .gps-dot { background: var(--success); }
        .gps-pill[data-q="fair"] .gps-dot { background: var(--warning); }
        .gps-pill[data-q="bad"] .gps-dot { background: var(--danger); }
        .big-btn { width: 100%; padding: 1rem; font-size: 1.05rem; border-radius: var(--radius-md); }
        .btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-primary); }
        .btn-success { background: var(--success); color: white; }
        .opt { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-md); margin-bottom: 0.5rem; cursor: pointer; }
        .opt input { width: 18px; height: 18px; }
        .opt.on-now { border-color: var(--success); }
        #map { height: 240px; border-radius: var(--radius-md); margin-top: 0.75rem; z-index: 0; }
        .cp { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.25rem; border-bottom: 1px solid var(--border-subtle); }
        .cp:last-child { border-bottom: none; }
        .cp-num { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; background: var(--bg-item); flex-shrink: 0; }
        .cp.done .cp-num { background: var(--success); color: white; }
        .cp.near { background: var(--info-bg); border-radius: var(--radius-md); }
        .cp-info { flex: 1; min-width: 0; }
        .cp-name { font-weight: 700; }
        .progress { height: 10px; background: var(--bg-item); border-radius: 999px; overflow: hidden; margin: 0.5rem 0; }
        .progress > div { height: 100%; background: var(--success); transition: width 0.3s; }
        .panic-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 900; width: min(560px, calc(100% - 32px));
            padding: 1.05rem; border: none; border-radius: 999px; background: #dc2626; color: white; font-weight: 900; font-size: 1.1rem; letter-spacing: 0.08em;
            box-shadow: 0 10px 25px rgba(220,38,38,0.45); display: flex; align-items: center; justify-content: center; gap: 0.6rem; cursor: pointer; }
        .modal-body { padding: 1.25rem; }
        .form-input.plain { padding: 0.7rem 0.85rem; font-size: 0.95rem; }
        label.lbl { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin: 0.75rem 0 0.35rem; }
        .two-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .two-btn .btn { white-space: normal; padding: 0.75rem 0.5rem; min-width: 0; }
        .g-bar h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
        .hidden { display: none !important; }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="g-bar">
            <div>
                <h1 id="guardName">Rondas</h1>
                <p id="condoName">SISDEL</p>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center;">
                <span class="gps-pill" id="gpsPill" data-q="none"><span class="gps-dot"></span><span id="gpsText">GPS</span></span>
                <a class="btn btn-ghost btn-sm" id="btnBack" href="garita.html">Garita</a>
                <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
            </div>
        </header>

        <!-- Sin turno: elegir ruta e iniciar -->
        <section id="viewIdle" class="hidden">
            <div class="g-card">
                <h2>Iniciar turno</h2>
                <p class="g-muted" id="idleNote">Elija la ruta que va a patrullar.</p>
                <div id="routeOptions" style="margin-top:0.75rem;"></div>
                <button class="btn btn-outline" id="btnStartPhoto" style="width:100%; margin-top:0.25rem;">Tomar foto de inicio (opcional)</button>
                <img id="startPhotoPreview" class="hidden" alt="Foto de inicio" style="width:100%; margin-top:0.5rem; border-radius:10px;">
                <button class="btn btn-primary big-btn" id="btnStartShift" style="margin-top:0.75rem;">Iniciar turno</button>
                <p class="g-muted" style="margin-top:0.5rem;">Se registra su ubicación al iniciar.</p>
            </div>
        </section>

        <!-- En turno -->
        <section id="viewShift" class="hidden">
            <div class="g-card">
                <div class="g-row">
                    <div>
                        <h2 id="shiftRoute" style="margin:0;">Ruta</h2>
                        <p class="g-muted" id="shiftInfo"></p>
                    </div>
                    <span class="badge badge-success">EN SERVICIO</span>
                </div>
                <div id="map"></div>
            </div>

            <div class="g-card" id="roundIdle">
                <h2 id="roundIdleTitle">Ronda</h2>
                <p class="g-muted" id="roundIdleInfo"></p>
                <button class="btn btn-primary big-btn" id="btnStartRound" style="margin-top:0.75rem;">Iniciar ronda</button>
            </div>

            <div class="g-card hidden" id="roundActive">
                <div class="g-row">
                    <h2 id="roundTitle" style="margin:0;">Ronda en curso</h2>
                    <span class="g-muted" id="roundClock"></span>
                </div>
                <div class="progress"><div id="roundProgress" style="width:0%"></div></div>
                <p class="g-muted" id="roundProgressText"></p>
                <button class="btn btn-success big-btn" id="btnMarkNearest" style="margin-top:0.75rem;" disabled>Acérquese a un punto de control</button>
                <div id="checkpointList" style="margin-top:0.75rem;"></div>
                <button class="btn btn-outline big-btn" id="btnFinishRound" style="margin-top:0.75rem;">Terminar ronda</button>
            </div>

            <div class="g-card">
                <div class="two-btn">
                    <button class="btn btn-outline" id="btnIncident">Reportar incidente</button>
                    <button class="btn btn-outline" id="btnEndShift">Terminar turno</button>
                </div>
            </div>
        </section>

        <p class="g-muted" id="loading" style="text-align:center; margin-top:2rem;">Cargando...</p>
    </div>

    <button class="panic-btn" id="btnPanic" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        PÁNICO
    </button>

    <!-- Fin de turno -->
    <div class="modal-overlay" id="modalEndShift" style="display:none;">
        <div class="modal" style="max-width:480px;">
            <div class="modal-header">
                <h3>Terminar turno</h3>
                <button class="btn btn-ghost btn-icon" data-close="modalEndShift">&times;</button>
            </div>
            <div class="modal-body">
                <p class="g-muted" id="endShiftNote">Se registra su ubicación al terminar.</p>
                <button class="btn btn-outline" id="btnEndPhoto" style="width:100%; margin-top:0.75rem;">Tomar foto de fin (opcional)</button>
                <img id="endPhotoPreview" class="hidden" alt="Foto de fin" style="width:100%; margin-top:0.5rem; border-radius:10px;">
                <button class="btn btn-primary big-btn" id="btnConfirmEndShift" style="margin-top:1rem;">Terminar turno</button>
            </div>
        </div>
    </div>

    <!-- Incidente -->
    <div class="modal-overlay" id="modalIncident" style="display:none;">
        <div class="modal" style="max-width:480px;">
            <div class="modal-header">
                <h3>Reportar incidente</h3>
                <button class="btn btn-ghost btn-icon" data-close="modalIncident">&times;</button>
            </div>
            <div class="modal-body">
                <label class="lbl" for="incType">Tipo</label>
                <select class="form-input plain" id="incType"></select>
                <label class="lbl" for="incSeverity">Gravedad</label>
                <select class="form-input plain" id="incSeverity"></select>
                <label class="lbl" for="incTitle">Título</label>
                <input class="form-input plain" id="incTitle" maxlength="120" placeholder="Ej. Portón dañado en muro norte">
                <label class="lbl" for="incDesc">Descripción</label>
                <textarea class="form-input plain" id="incDesc" rows="3" placeholder="¿Qué pasó?"></textarea>
                <button class="btn btn-outline" id="btnIncPhoto" style="margin-top:0.75rem; width:100%;">Tomar foto</button>
                <img id="incPhotoPreview" class="hidden" alt="Foto del incidente" style="width:100%; margin-top:0.5rem; border-radius:10px;">
                <button class="btn btn-primary big-btn" id="btnSendIncident" style="margin-top:1rem;">Enviar incidente</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>
    <script src="firebase-client.js?v=20260929"></script>
    <script>
        // Sin señal en la ronda: los registros quedan en el telefono y se suben al volver la conexion.
        // Debe activarse antes de cualquier lectura o escritura.
        try { window.sisdelFirebase.db.enablePersistence({ synchronizeTabs: true }).catch((e) => console.warn('Sin modo sin conexion:', e.code)); } catch (e) { console.warn(e); }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="sisdel-core.js?v=20261108"></script>
    <script src="rondas-logic.js?v=20261108"></script>
    <script src="rondas-core.js?v=20261108"></script>
    <script src="panico-alertas.js?v=20261108"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await SISDEL.requireAuth([SISDEL.ROLES.POLICIA, SISDEL.ROLES.SUPERVISOR]);
            if (!session) return;
            const L = SisdelRondasLogic;
            const R = SisdelRondas;
            R.init(session);

            const $ = (id) => document.getElementById(id);
            const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const show = (id, on) => $(id).classList.toggle('hidden', !on);
            const time = (iso) => iso ? new Date(iso).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' }) : '';
            const isSupervisor = session.role === SISDEL.ROLES.SUPERVISOR;

            $('guardName').textContent = session.userName || 'Guardia';
            $('condoName').textContent = session.condominioName || '';
            if (isSupervisor) { $('btnBack').href = 'rondas.html'; $('btnBack').textContent = 'Panel'; }
            $('btnLogout').addEventListener('click', async () => {
                if (state.shift && !confirm('Tiene un turno abierto. Si sale, el turno sigue abierto hasta que lo termine. ¿Salir?')) return;
                stopTracking();
                SISDEL.logout();
            });

            // Alertas de panico de vecinos y otros guardias
            SisdelPanico.watch({ canResolve: isSupervisor });

            const state = { routes: [], assignments: [], shift: null, route: null, round: null, rounds: [], visits: [], pos: null, last: null, watchId: null, wakeLock: null, map: null, layers: null };

            // ── GPS ──
            function setGps(pos, error) {
                const pill = $('gpsPill');
                if (error || !pos) { pill.dataset.q = 'bad'; $('gpsText').textContent = 'Sin GPS'; return; }
                pill.dataset.q = pos.accuracy <= 20 ? 'good' : pos.accuracy <= 50 ? 'fair' : 'bad';
                $('gpsText').textContent = `GPS ±${pos.accuracy} m`;
            }

            function startTracking() {
                if (state.watchId !== null || !navigator.geolocation) return;
                state.watchId = navigator.geolocation.watchPosition((p) => {
                    const pos = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy || 0) };
                    state.pos = pos;
                    setGps(pos);
                    renderCheckpoints();
                    updateMapGuard();
                    sendLocation(pos);
                }, () => setGps(null, true), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
                keepScreenOn();
            }

            function stopTracking() {
                if (state.watchId !== null) navigator.geolocation.clearWatch(state.watchId);
                state.watchId = null;
                if (state.wakeLock) { state.wakeLock.release().catch(() => {}); state.wakeLock = null; }
            }

            // La pantalla encendida ayuda a que el navegador siga leyendo el GPS
            async function keepScreenOn() {
                try { if ('wakeLock' in navigator && !state.wakeLock) state.wakeLock = await navigator.wakeLock.request('screen'); } catch { /* no disponible */ }
            }
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.shift) { state.wakeLock = null; keepScreenOn(); } });

            // Al empezar o terminar una ronda se avisa al panel aunque el guardia no se haya movido
            function pushLiveNow() {
                if (!state.shift || !state.pos) return;
                state.last = { lat: state.pos.lat, lng: state.pos.lng, atMs: Date.now(), historyAtMs: state.last ? state.last.historyAtMs : 0 };
                R.updateLive(state.shift, state.round, state.pos, false).catch((e) => console.warn('ubicacion', e));
            }

            async function sendLocation(pos) {
                if (!state.shift) return;
                const now = Date.now();
                const due = L.locationDue(state.last, pos, now);
                if (!due.live && !due.history) return;
                state.last = { lat: pos.lat, lng: pos.lng, atMs: due.live ? now : state.last.atMs, historyAtMs: due.history ? now : (state.last ? state.last.historyAtMs : 0) };
                try { await R.updateLive(state.shift, state.round, pos, due.history); } catch (e) { console.warn('ubicacion', e); }
            }

            // ── Mapa ──
            function initMap() {
                if (state.map || typeof window.L === 'undefined') return;
                state.map = window.L.map('map', { zoomControl: true, attributionControl: true });
                window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(state.map);
                state.layers = window.L.layerGroup().addTo(state.map);
            }

            function drawRoute() {
                if (!state.map || !state.route) return;
                state.layers.clearLayers();
                const cps = L.activeCheckpoints(state.route);
                const done = new Set(state.visits.filter((v) => v.status === 'VALID').map((v) => v.checkpointId));
                const pts = cps.map((c) => [c.lat, c.lng]);
                if (pts.length > 1) window.L.polyline(pts, { color: state.route.color || '#3B82F6', weight: 3, opacity: 0.7, dashArray: '6 6' }).addTo(state.layers);
                cps.forEach((c, i) => {
                    window.L.circle([c.lat, c.lng], { radius: c.radius || 25, color: done.has(c.id) ? '#10b981' : '#3b82f6', weight: 1, fillOpacity: 0.15 }).addTo(state.layers);
                    window.L.marker([c.lat, c.lng], { icon: window.L.divIcon({ className: '', html: `<div style="width:24px;height:24px;border-radius:50%;background:${done.has(c.id) ? '#10b981' : '#3b82f6'};color:#fff;font:700 12px sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">${i + 1}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) })
                        .bindTooltip(esc(c.name)).addTo(state.layers);
                });
                if (pts.length) state.map.fitBounds(window.L.latLngBounds(pts).pad(0.3));
                updateMapGuard();
            }

            let guardMarker = null;
            function updateMapGuard() {
                if (!state.map || !state.pos) return;
                const ll = [state.pos.lat, state.pos.lng];
                if (!guardMarker) {
                    guardMarker = window.L.circleMarker(ll, { radius: 8, color: '#fff', weight: 2, fillColor: '#f59e0b', fillOpacity: 1 }).addTo(state.map).bindTooltip('Usted');
                } else guardMarker.setLatLng(ll);
            }

            // ── Pantallas ──
            async function load() {
                try {
                    [state.routes, state.assignments, state.shift] = await Promise.all([R.listRoutes(), R.myAssignments(), R.myActiveShift()]);
                } catch (e) {
                    console.error(e);
                    $('loading').textContent = 'No se pudo cargar. Revise su conexión y recargue.';
                    return;
                }
                $('loading').classList.add('hidden');
                if (state.shift) await enterShift();
                else renderIdle();
            }

            function renderIdle() {
                show('viewIdle', true); show('viewShift', false);
                const now = new Date();
                const active = state.assignments.filter((a) => L.assignmentActiveAt(a, now));
                const byId = new Map(state.routes.map((r) => [r.id, r]));
                // El guardia patrulla lo que tiene asignado; el supervisor puede elegir cualquier ruta
                let options = active.map((a) => ({ route: byId.get(a.routeId), assignment: a })).filter((o) => o.route);
                if (isSupervisor) {
                    const seen = new Set(options.map((o) => o.route.id));
                    state.routes.forEach((r) => { if (!seen.has(r.id)) options.push({ route: r, assignment: null }); });
                }
                if (!options.length) {
                    $('idleNote').textContent = state.assignments.length
                        ? 'No tiene una ruta asignada en este horario. Consulte a su supervisor.'
                        : 'No tiene rutas asignadas. Consulte a su supervisor.';
                    $('routeOptions').innerHTML = '';
                    $('btnStartShift').disabled = true;
                    return;
                }
                $('idleNote').textContent = 'Elija la ruta que va a patrullar.';
                $('btnStartShift').disabled = false;
                $('routeOptions').innerHTML = options.map((o, i) => `
                    <label class="opt ${o.assignment ? 'on-now' : ''}">
                        <input type="radio" name="routeOpt" value="${i}" ${i === 0 ? 'checked' : ''}>
                        <div><div style="font-weight:700;">${esc(o.route.name)}</div>
                        <div class="g-muted">${o.assignment ? `Asignada: ${esc(o.assignment.hourStart)} a ${esc(o.assignment.hourEnd)}` : 'Sin asignación'} · ${L.activeCheckpoints(o.route).length} puntos</div></div>
                    </label>`).join('');
                $('btnStartShift').onclick = async () => {
                    const pick = options[Number((document.querySelector('input[name="routeOpt"]:checked') || {}).value || 0)];
                    await startShift(pick);
                };
            }

            // La camara se abre directo desde el toque del boton (los celulares lo exigen)
            let startPhoto = null;
            $('btnStartPhoto').addEventListener('click', async () => {
                startPhoto = await R.takePhoto();
                $('startPhotoPreview').classList.toggle('hidden', !startPhoto);
                if (startPhoto) $('startPhotoPreview').src = startPhoto;
            });

            async function startShift(pick) {
                const btn = $('btnStartShift');
                btn.disabled = true; btn.textContent = 'Obteniendo ubicación...';
                const pos = await R.getPosition();
                if (!pos) {
                    btn.disabled = false; btn.textContent = 'Iniciar turno';
                    alert('No se pudo obtener su ubicación. Active el GPS y dé permiso de ubicación al navegador.');
                    return;
                }
                const photo = startPhoto;
                btn.textContent = 'Iniciando...';
                try {
                    state.shift = await R.startShift({ route: pick.route, assignment: pick.assignment, pos, photo });
                    state.pos = pos;
                    startPhoto = null;
                    $('startPhotoPreview').classList.add('hidden');
                    SISDEL.showToast('Turno iniciado', 'success');
                    await enterShift();
                } catch (e) {
                    console.error(e);
                    SISDEL.showToast('No se pudo iniciar el turno', 'error');
                } finally { btn.disabled = false; btn.textContent = 'Iniciar turno'; }
            }

            async function enterShift() {
                show('viewIdle', false); show('viewShift', true);
                state.route = state.routes.find((r) => r.id === state.shift.routeId) || await R.getRoute(state.shift.routeId);
                if (!state.route) { SISDEL.showToast('La ruta de este turno ya no existe. Termine el turno.', 'warning'); state.route = { id: state.shift.routeId, name: state.shift.routeName, checkpoints: [] }; }
                state.rounds = await R.shiftRounds(state.shift);
                state.round = state.rounds.find((r) => r.status === 'IN_PROGRESS') || null;
                state.visits = state.round ? await R.roundVisits(state.round) : [];
                $('shiftRoute').textContent = state.route.name;
                initMap();
                setTimeout(() => { if (state.map) state.map.invalidateSize(); drawRoute(); }, 50);
                startTracking();
                renderRound();
            }

            function renderRound() {
                const done = state.rounds.filter((r) => r.status !== 'IN_PROGRESS').length;
                const target = (state.route.config && state.route.config.roundsPerShift) || 4;
                $('shiftInfo').textContent = `Turno desde las ${time(state.shift.startedAt)} · Rondas: ${done} de ${target}`;
                show('roundIdle', !state.round); show('roundActive', !!state.round);
                if (!state.round) {
                    $('roundIdleTitle').textContent = `Ronda ${done + 1}`;
                    $('roundIdleInfo').textContent = done ? `Última: ${state.rounds[0] ? `${state.rounds[0].score}% (${state.rounds[0].status === 'COMPLETED' ? 'completa' : 'incompleta'})` : ''}` : 'Recorra todos los puntos de control de la ruta.';
                    return;
                }
                $('roundTitle').textContent = `Ronda ${state.round.number}`;
                renderCheckpoints();
            }

            function renderCheckpoints() {
                if (!state.round || !state.route) return;
                const cps = L.activeCheckpoints(state.route);
                const done = new Set(state.visits.filter((v) => v.status === 'VALID').map((v) => v.checkpointId));
                const score = L.roundScore(state.route, state.visits);
                $('roundProgress').style.width = `${score.total ? (score.visited / score.total) * 100 : 0}%`;
                $('roundProgressText').textContent = `${score.visited} de ${score.total} puntos obligatorios`;
                const minutes = Math.round((Date.now() - Date.parse(state.round.startedAt)) / 60000);
                const max = (state.route.config && state.route.config.maxMinutes) || 45;
                $('roundClock').textContent = `${minutes} min${minutes > max ? ' · pasada de tiempo' : ''}`;
                $('roundClock').style.color = minutes > max ? 'var(--danger)' : '';

                const near = state.pos ? L.nearestCheckpoint(state.route, state.pos) : null;
                const sequentialNext = state.route.config && state.route.config.sequential ? L.nextCheckpoint(state.route, state.visits) : null;
                const canMark = near && !done.has(near.checkpoint.id) && L.withinRadius(near.checkpoint, near.distance, state.pos.accuracy)
                    && (!sequentialNext || sequentialNext.id === near.checkpoint.id);
                const btn = $('btnMarkNearest');
                btn.disabled = !canMark;
                btn.textContent = canMark ? `Marcar: ${near.checkpoint.name}` : (near && !done.has(near.checkpoint.id) ? `${near.checkpoint.name} a ${Math.round(near.distance)} m` : 'Acérquese a un punto de control');
                btn.onclick = canMark ? () => mark(near.checkpoint, 'GPS') : null;

                $('checkpointList').innerHTML = cps.map((c, i) => {
                    const isDone = done.has(c.id);
                    const dist = state.pos ? Math.round(L.haversine(state.pos.lat, state.pos.lng, c.lat, c.lng)) : null;
                    const isNear = near && near.checkpoint.id === c.id && !isDone;
                    return `
                    <div class="cp ${isDone ? 'done' : ''} ${isNear ? 'near' : ''}">
                        <div class="cp-num">${isDone ? '&#10003;' : i + 1}</div>
                        <div class="cp-info">
                            <div class="cp-name">${esc(c.name)}${c.mandatory === false ? ' <span class="g-muted">(opcional)</span>' : ''}</div>
                            <div class="g-muted">${isDone ? 'Visitado' : dist !== null ? `a ${dist} m` : 'Sin GPS'}${sequentialNext && sequentialNext.id === c.id ? ' · siguiente' : ''}</div>
                        </div>
                        ${isDone ? '' : `<button class="btn btn-ghost btn-sm" data-code="${esc(c.id)}">Código</button>`}
                    </div>`;
                }).join('');
            }

            // Sin GPS confiable: el guardia escribe el codigo impreso en el punto
            $('checkpointList').addEventListener('click', async (e) => {
                const b = e.target.closest('[data-code]');
                if (!b) return;
                const cp = L.activeCheckpoints(state.route).find((c) => c.id === b.dataset.code);
                const typed = prompt(`Escriba el código impreso en "${cp.name}"`);
                if (typed === null) return;
                if (L.normalizeCode(typed) !== L.normalizeCode(cp.code)) { alert('El código no coincide con este punto.'); return; }
                await mark(cp, 'CODIGO');
            });

            async function mark(cp, method) {
                const btn = $('btnMarkNearest');
                btn.disabled = true;
                try {
                    const pos = method === 'GPS' ? state.pos : (state.pos || await R.getPosition(8000));
                    const visit = await R.markVisit(state.round, cp, pos, method);
                    state.visits.push(visit);
                    if (navigator.vibrate) navigator.vibrate(150);
                    SISDEL.showToast(visit.status === 'VALID' ? `Punto registrado: ${cp.name}` : `Registrado fuera del radio (${visit.distance ?? '?'} m): queda como sospechoso`, visit.status === 'VALID' ? 'success' : 'warning');
                    drawRoute();
                    if (L.isRoundDone(state.route, state.visits)) await finishRound(true);
                    else renderCheckpoints();
                } catch (e) {
                    console.error(e);
                    SISDEL.showToast('No se pudo registrar el punto', 'error');
                    renderCheckpoints();
                }
            }

            $('btnStartRound').addEventListener('click', async () => {
                const btn = $('btnStartRound');
                if (!L.mandatoryCheckpoints(state.route).length) { alert('Esta ruta no tiene puntos de control. Avise a su supervisor.'); return; }
                btn.disabled = true;
                try {
                    const number = state.rounds.length + 1;
                    state.round = await R.startRound(state.shift, state.route, number);
                    state.rounds.unshift(state.round);
                    state.visits = [];
                    drawRoute();
                    renderRound();
                    pushLiveNow();
                } catch (e) { console.error(e); SISDEL.showToast('No se pudo iniciar la ronda', 'error'); }
                finally { btn.disabled = false; }
            });

            async function finishRound(auto) {
                if (!state.round) return;
                const result = L.roundScore(state.route, state.visits);
                if (!auto && result.visited < result.total && !confirm(`Faltan ${result.total - result.visited} puntos. La ronda quedará con ${result.score}%. ¿Terminarla?`)) return;
                try {
                    const closed = await R.finishRound(state.round, state.route, state.visits);
                    state.rounds = state.rounds.map((r) => (r.id === closed.id ? closed : r));
                    state.round = null;
                    state.visits = [];
                    SISDEL.showToast(auto ? 'Ronda completa: todos los puntos visitados' : `Ronda terminada: ${closed.score}%`, closed.status === 'COMPLETED' ? 'success' : 'warning');
                    drawRoute();
                    renderRound();
                    pushLiveNow();
                } catch (e) { console.error(e); SISDEL.showToast('No se pudo terminar la ronda', 'error'); }
            }
            $('btnFinishRound').addEventListener('click', () => finishRound(false));

            let endPhoto = null;
            $('btnEndShift').addEventListener('click', () => {
                endPhoto = null;
                $('endPhotoPreview').classList.add('hidden');
                $('endShiftNote').textContent = state.round
                    ? 'Hay una ronda en curso: se cerrará con los puntos marcados. Se registra su ubicación al terminar.'
                    : 'Se registra su ubicación al terminar.';
                $('modalEndShift').style.display = 'flex';
            });
            $('btnEndPhoto').addEventListener('click', async () => {
                endPhoto = await R.takePhoto();
                $('endPhotoPreview').classList.toggle('hidden', !endPhoto);
                if (endPhoto) $('endPhotoPreview').src = endPhoto;
            });
            $('btnConfirmEndShift').addEventListener('click', async () => {
                const btn = $('btnConfirmEndShift');
                btn.disabled = true;
                if (state.round) await finishRound(true);
                const pos = state.pos || await R.getPosition(8000);
                const photo = endPhoto;
                try {
                    await R.endShift(state.shift, { pos, photo });
                    stopTracking();
                    await R.clearLive();
                    state.shift = null; state.round = null; state.visits = []; state.last = null;
                    $('modalEndShift').style.display = 'none';
                    SISDEL.showToast('Turno terminado', 'success');
                    renderIdle();
                } catch (e) { console.error(e); SISDEL.showToast('No se pudo terminar el turno', 'error'); }
                finally { btn.disabled = false; }
            });

            // ── Incidentes ──
            let incPhoto = null;
            $('incType').innerHTML = L.INCIDENT_TYPES.map((t) => `<option>${esc(t)}</option>`).join('');
            $('incSeverity').innerHTML = Object.entries(L.SEVERITIES).map(([k, v]) => `<option value="${k}" ${k === 'MEDIUM' ? 'selected' : ''}>${esc(v)}</option>`).join('');
            document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { $(b.dataset.close).style.display = 'none'; }));
            $('btnIncident').addEventListener('click', () => {
                incPhoto = null; $('incTitle').value = ''; $('incDesc').value = '';
                $('incPhotoPreview').classList.add('hidden');
                $('modalIncident').style.display = 'flex';
            });
            $('btnIncPhoto').addEventListener('click', async () => {
                incPhoto = await R.takePhoto();
                if (incPhoto) { $('incPhotoPreview').src = incPhoto; $('incPhotoPreview').classList.remove('hidden'); }
            });
            $('btnSendIncident').addEventListener('click', async () => {
                const btn = $('btnSendIncident');
                btn.disabled = true; btn.textContent = 'Enviando...';
                try {
                    const pos = state.pos || await R.getPosition(8000);
                    await R.reportIncident({
                        shift: state.shift, round: state.round, type: $('incType').value, severity: $('incSeverity').value,
                        title: $('incTitle').value || $('incType').value, description: $('incDesc').value, pos, photo: incPhoto
                    });
                    $('modalIncident').style.display = 'none';
                    SISDEL.showToast('Incidente enviado al supervisor', 'success');
                } catch (e) { console.error(e); SISDEL.showToast('No se pudo enviar el incidente', 'error'); }
                finally { btn.disabled = false; btn.textContent = 'Enviar incidente'; }
            });

            // ── Panico del guardia ──
            $('btnPanic').addEventListener('click', async () => {
                if (!confirm('¿ACTIVAR ALERTA DE PÁNICO?\n\nSe avisará de inmediato a la administración, al supervisor y a la central.')) return;
                const btn = $('btnPanic');
                btn.disabled = true;
                try {
                    const pos = state.pos || await R.getPosition(6000);
                    await R.raisePanic({ source: 'guardia', pos, casa: state.shift ? `Ronda: ${state.shift.routeName}` : 'Garita' });
                    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
                    SISDEL.showToast('Alerta de pánico enviada', 'warning');
                } catch (e) { console.error(e); SISDEL.showToast('No se pudo enviar la alerta. Llame por teléfono.', 'error'); }
                finally { setTimeout(() => { btn.disabled = false; }, 5000); }
            });

            setInterval(() => { if (state.round) renderCheckpoints(); }, 30000);
            await load();
            SISDEL.reportPageLoad('rondin');
        });
    </script>
</body>

</html>
